LOG > @DEBUG_LOG@

R13 = 0x20020000
G main, HRC_Sim_TestComplete

SAVE @TRACE_FILE@ @TRACE_START@, @TRACE_END@
SAVE @CYCLES_FILE@ @CYCLES_START@, @CYCLES_END@
SAVE @SUMMARY_FILE@ @SUMMARY_START@, @SUMMARY_END@

EVAL g_hrc_summary_record.overall_pass
EVAL g_hrc_summary_record.failures
EVAL g_hrc_summary_record.protocol_errors
EVAL g_hrc_summary_record.trace_count
EVAL g_hrc_summary_record.cycle_count

LOG OFF
EXIT
